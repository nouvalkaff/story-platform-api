name: story-platform-api

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - story_platform_network
    restart: unless-stopped

  migrate:
    build:
      context: .
    command:
      [
        "sh",
        "-c",
        "python docker/wait_for_db.py && alembic upgrade head",
      ]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - story_platform_network
    restart: "no"

  api:
    build:
      context: .
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - story_platform_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  story_platform_network:
    driver: bridge
